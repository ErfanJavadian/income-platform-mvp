name: Deploy Agent Studio preview to GitHub Pages

on:
  push:
    branches:
      - agent-platform-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-agent-studio-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent Studio
        uses: actions/checkout@v4
        with:
          ref: agent-platform-v1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
